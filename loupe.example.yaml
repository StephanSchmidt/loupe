org: acme-eng        # for bitbucket-cloud this is the Bitbucket workspace slug
# title: Acme Engineering   # deck headline (the deck adds "AI Impact Report"); falls back to org

git_host:
  provider: bitbucket-cloud
  base_url: https://api.bitbucket.org/2.0
  username: you@example.com
  # The secret is prompted at every `loupe baseline` invocation. You can use
  # either a Bitbucket app password (username = your Bitbucket username) or an
  # Atlassian API token with Bitbucket scopes (username = your email). With an
  # API token the same credential also covers jira-cloud below — loupe scopes
  # to `org` and never calls the account-level /2.0/workspaces endpoint that
  # API tokens can't use.
  #
  # Alternative providers:
  #
  # GitHub (PAT covers both git host and tracker if both are github):
  #   provider: github
  #   base_url: https://api.github.com
  #
  # GitLab (cloud or self-hosted; a single PAT covers both roles):
  #   provider: gitlab
  #   base_url: https://gitlab.com         # or https://gitlab.acme.com
  #
  # Azure DevOps (cloud or Server; PAT covers both roles):
  #   provider: azuredevops
  #   base_url: https://dev.azure.com      # or https://devops.acme.com/tfs
  #   username: myorg                      # Azure organization name

tracker:
  provider: jira-cloud
  site: acme.atlassian.net
  email: you@example.com
  # Jira API token is prompted at every `loupe baseline` invocation.
  #
  # Alternatives:
  #   provider: github   (project keys = "owner/repo")
  #   provider: gitlab
  #     base_url: https://gitlab.com       # match the git_host base_url
  #     # project keys = "group/.../project" (path_with_namespace)
  #   provider: linear   (project keys = team key, e.g. "ENG")
  #   provider: azuredevops
  #     base_url: https://dev.azure.com
  #     site: myorg                        # Azure org (optional if git_host is also azuredevops)

teams:
  - name: platform
    members: [alice@acme.com, bob@acme.com]
  - name: product
    members: [carol@acme.com, dan@acme.com]

ai_adoption:
  # auto-detect by default; uncomment to pin manually
  # cutover_date: 2026-03-15
  detection:
    co_author_trailers: true
    body_footers: true
    bot_authors: true
    # Squash-merge recovery costs one extra API call per PR; turn off
    # if you're rate-limited on a huge org.
    squash_merge_recovery: true
    # Seat inference is the only detector that infers rather than
    # observes — it propagates direct evidence to other commits the
    # same author made in the same week and repo. Off by default.
    seat_inference: false
    # Labels and branch prefixes are case-insensitive. The defaults
    # below are baked in when these lists are empty; override here to
    # add org-specific patterns.
    pr_labels: [ai-generated, ai-assisted, copilot, claude, cursor, aider, devin, jules, gemini]
    branch_prefixes: ["copilot/", "cursor/", "claude/", "aider/", "devin/", "jules/"]
  min_weekly_commits_for_cutover: 0.05

cycle_time:
  # Tracker status names (case-insensitive) that mark "development started".
  # The first transition INTO any of these defines idea→dev. Tickets without
  # a matching transition fall back to the timestamp of their first linked
  # commit.
  dev_started_statuses: [In Progress, In Development, In Review, Code Review]

  # Statuses that mark a ticket resolved. Used (alongside the resolved/closed
  # timestamps Jira sets automatically) to drop tickets out of the
  # work-in-progress and lead-time charts.
  done_statuses: [Done, Closed, Resolved]

  # Terminal "dropped" statuses — won't-do, archived, cancelled, etc. Tickets
  # reaching any of these count as neither open nor done; they're excluded
  # from the work-in-progress and lead-time charts entirely. Empty by
  # default — add your workflow's own names here (this stays in your private
  # config; it is never published).
  #   abandoned_statuses: ["Won't Do", "Archived", "Cancelled"]
  abandoned_statuses: []

windows:
  baseline_weeks: 12
  comparison_weeks: 12
  # How many months of recent history the deck charts show. Older commits
  # stay in the store (and still drive cutover detection); they're just
  # hidden from the time-series charts so the axes stay readable. The
  # --months flag overrides this per run.
  display_months: 6

# Optional per-project lenses. Each renders a scoped copy of every
# time-series chart immediately after its org-wide slide. Omit to get just
# the org-wide deck.
#   focus:
#     - name: payments                 # identifier
#       title: Payments                # slide label (falls back to name)
#       tracker_project: PAY           # Jira project key → scopes ticket charts
#       repos: [payments-api]          # Bitbucket repo slug(s) → scopes commit charts

output:
  path: ./reports
