name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go tool golangci-lint run ./...
      # nilaway's whole-program analysis peaks above the runner's RAM and
      # gets OOM-killed ("signal: killed") without these: GOMEMLIMIT keeps
      # the Go runtime GC-ing below the kill threshold, GOGC=50 trades CPU
      # for a lower peak.
      - run: go tool nilaway ./...
        env:
          GOGC: "50"
          GOMEMLIMIT: 12GiB
      - run: go tool gocyclo -over 15 .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go tool gosec ./...
      - run: go tool govulncheck ./...
